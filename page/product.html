<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0e3d34">
  <title>Product Details | Subeesha</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/product-detail.css">
<link rel="stylesheet" href="../assets/css/site-polish.css">
</head>
<body data-page="product">
  <header class="pd-header">
    <nav class="pd-nav">
      <a href="../index.html" class="brand-logo-circle" aria-label="Subeesha home"><img src="../assets/images/logo.jpg" alt="Subeesha"></a>
      <ul class="pd-nav-links" id="navLinks">
        <li><a href="../index.html">Home</a></li><li><a href="Categories.html">Categories</a></li><li><a href="shop.html" class="active">Shop</a></li><li><a href="new-arrivals.html">New Arrivals</a></li><li><a href="flashsale.html">Flash Sale</a></li><li><a href="loyalty.html">Rewards</a></li><li><a href="../index.html#footer">Contact</a></li>
      </ul>
      <form class="header-search pd-search" onsubmit="return false" role="search">
        <button type="button" class="site-search-toggle" aria-label="Open search"><i class="fa-solid fa-magnifying-glass"></i></button>
        <i class="fa-solid fa-magnifying-glass pd-search-desktop" aria-hidden="true"></i>
        <input type="search" id="pdHeaderSearch" placeholder="Search products, categories..." autocomplete="off" aria-label="Search products">
        <button type="submit" aria-label="Search"><i class="fa-solid fa-arrow-right"></i></button>
      </form>
      <div class="pd-header-actions">
        <a href="../page/profile.html#wishlist" class="pd-icon" aria-label="Wishlist"><i class="fa-regular fa-heart"></i></a>
        <a href="../account.html" class="pd-icon" aria-label="Account"><i class="fa-regular fa-user"></i></a>
        <button class="pd-icon" onclick="showCart()" aria-label="Shopping bag"><i class="fa-solid fa-bag-shopping"></i><span class="cart-count" id="cartCount">0</span></button>
        <button class="pd-icon pd-menu" onclick="toggleMenu()" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
      </div>
    </nav>
  </header>
  <main class="pd-container">
    <div class="pd-breadcrumb"><a href="../index.html">Home</a><i class="fa-solid fa-chevron-right"></i><a href="shop.html">Shop</a><i class="fa-solid fa-chevron-right"></i><span id="breadcrumbName">Product</span></div>
    <div id="productDetail" class="pd-content">
      <div class="pd-gallery"><div class="pd-skeleton pd-skeleton-main"></div><div class="pd-skeleton-thumbs"><i class="pd-skeleton"></i><i class="pd-skeleton"></i><i class="pd-skeleton"></i></div></div>
      <div class="pd-summary"><div class="pd-skeleton pd-skeleton-line" style="width:36%"></div><div class="pd-skeleton pd-skeleton-title"></div><div class="pd-skeleton pd-skeleton-line" style="width:28%"></div><div class="pd-skeleton pd-skeleton-price"></div><div class="pd-skeleton pd-skeleton-copy"></div><div class="pd-skeleton pd-skeleton-copy"></div><div class="pd-skeleton pd-skeleton-copy short"></div><div class="pd-skeleton pd-skeleton-line" style="width:26%;margin-top:30px"></div><div class="pd-skeleton pd-skeleton-options"></div><div class="pd-skeleton pd-skeleton-button"></div></div>
    </div>
    <section class="pd-related" id="pdRelated" hidden aria-label="Related products"></section>
    <section class="pd-notice" id="productMessage" hidden></section>
  </main>
  <footer class="pd-footer"><a href="../index.html">Subeesha</a><span>Thoughtfully selected, made easy to shop.</span></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"><div class="toast-icon"><i class="fa-solid fa-circle-check"></i></div><div class="toast-content"><strong class="toast-title">Success</strong><span class="toast-message"></span></div><button class="toast-close" onclick="hideToast()" aria-label="Close"><i class="fa-solid fa-xmark"></i></button><div class="toast-progress"></div></div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/sub-core.js"></script>
  <script src="../assets/js/main.js" defer></script>
  <script src="../assets/js/store.js" defer></script>
  <script src="../assets/js/product-detail.js" defer></script>
<script src="../assets/js/site-polish.js"></script>
</body>
</html>
